[profile.default]
src = "src"
out = "out"
libs = ["lib"]

solc = "0.8.24"
evm_version = "paris"

optimizer = true
optimizer_runs = 200

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"

[etherscan]
arc_testnet = { 
    key = "${ARCSCAN_API_KEY}",
    url = "https://testnet.arcscan.app/api/",
    chain = 5042002
}

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
